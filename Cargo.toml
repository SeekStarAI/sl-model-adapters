[package]
name = "sl-model-adapters"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
description = "Model-family lowering from StarLight model bundles to sl-ir programs."
repository = "https://github.com/SeekStarAI/sl-model-adapters"
readme = "README.md"

[dependencies]
sl-model = "0.1.0"
sl-ir = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sl-graph = "0.1.0"
